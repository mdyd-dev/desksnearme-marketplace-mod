query listing_get($id: ID!) {
  records(per_page: 1, filter: { id: { value: $id }, table: { value: "listing" } }) {
    results {
      id
      uuid: property(name: "uuid")
      title: property(name: "title")
      description: property(name: "description")
      listing_type: property(name: "listing_type")
      capacity: property_int(name: "capacity")
      building_hours: property(name: "building_hours")
      listing_hours: property(name: "listing_hours")
      access_24_7: property_boolean(name: "access_24_7")
      amenities: property_array(name: "amenities")
      location_precision: property(name: "location_precision")
      address: property(name: "address")
      city: property(name: "city")
      state: property(name: "state")
      postcode: property(name: "postcode")
      country_code: property(name: "country_code")
      formatted_address: property(name: "formatted_address")
      place_id: property(name: "place_id")
      geo_verified: property_boolean(name: "geo_verified")
      latitude: property_float(name: "latitude")
      longitude: property_float(name: "longitude")
      price_hour: property_float(name: "price_hour")
      price_day: property_float(name: "price_day")
      price_week: property_float(name: "price_week")
      price_month: property_float(name: "price_month")
      status: property(name: "status")
      host_id: property(name: "host_id")
      host_name: property(name: "host_name")
      created_at
      host: related_user(join_on_property: "host_id") {
        id
        name
        first_name
        company_name: property(name: "company_name")
      }
    }
  }
}