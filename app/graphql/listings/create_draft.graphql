mutation listing_create_draft(
  $uuid: String
  $host_id: String!
  $host_name: String
  $status: String!
) {
  record_create(
    record: {
      table: "listing"
      properties: [
        { name: "uuid", value: $uuid }
        { name: "host_id", value: $host_id }
        { name: "host_name", value: $host_name }
        { name: "status", value: $status }
      ]
    }
  ) {
    id
  }
}