query listings_get_for_reindex($host_id: String!) {
  records(
    per_page: 200
    filter: {
      table: { value: "listing" }
      properties: [{ name: "host_id", value: $host_id }]
    }
  ) {
    results {
      id
      title: property(name: "title")
      city: property(name: "city")
      state: property(name: "state")
      postcode: property(name: "postcode")
    }
  }
}