query listings_get_all($per_page: Int = 50, $page: Int = 1) {
  records(
    per_page: $per_page
    page: $page
    sort: [{ created_at: { order: DESC } }]
    filter: { table: { value: "listing" } }
  ) {
    total_entries
    results {
      id
      title: property(name: "title")
      listing_type: property(name: "listing_type")
      city: property(name: "city")
      status: property(name: "status")
      host_id: property(name: "host_id")
      created_at
    }
  }
}