mutation listing_update(
  $id: ID!
  $uuid: String
  $title: String
  $description: String
  $listing_type: String
  $capacity: Int
  $building_hours: String
  $listing_hours: String
  $access_24_7: Boolean
  $amenities: [String!]
  $address: String
  $city: String
  $state: String
  $postcode: String
  $country_code: String
  $formatted_address: String
  $place_id: String
  $geo_verified: Boolean
  $location_precision: String
  $latitude: Float
  $longitude: Float
  $price_hour: Float
  $price_day: Float
  $price_week: Float
  $price_month: Float
  $host_name: String
  $search_text: String
  $status: String!
) {
  record_update(
    id: $id
    record: {
      properties: [
        { name: "uuid", value: $uuid }
        { name: "title", value: $title }
        { name: "description", value: $description }
        { name: "listing_type", value: $listing_type }
        { name: "capacity", value_int: $capacity }
        { name: "building_hours", value: $building_hours }
        { name: "listing_hours", value: $listing_hours }
        { name: "access_24_7", value_boolean: $access_24_7 }
        { name: "amenities", value_array: $amenities }
        { name: "address", value: $address }
        { name: "city", value: $city }
        { name: "state", value: $state }
        { name: "postcode", value: $postcode }
        { name: "country_code", value: $country_code }
        { name: "formatted_address", value: $formatted_address }
        { name: "place_id", value: $place_id }
        { name: "geo_verified", value_boolean: $geo_verified }
        { name: "location_precision", value: $location_precision }
        { name: "latitude", value_float: $latitude }
        { name: "longitude", value_float: $longitude }
        { name: "price_hour", value_float: $price_hour }
        { name: "price_day", value_float: $price_day }
        { name: "price_week", value_float: $price_week }
        { name: "price_month", value_float: $price_month }
        { name: "host_name", value: $host_name }
        { name: "search_text", value: $search_text }
        { name: "status", value: $status }
      ]
    }
  ) {
    id
  }
}