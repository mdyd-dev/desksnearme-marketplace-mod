query users_admin_search($q: String!, $per_page: Int!, $page: Int!) {
  users(
    per_page: $per_page
    page: $page
    filter: {
      or: [
        { first_name: { contains: $q } }
        { last_name: { contains: $q } }
        { name: { contains: $q } }
        { email: { contains: $q } }
      ]
    }
  ) {
    total_entries
    results {
      id
      first_name
      last_name
      email
    }
  }
}