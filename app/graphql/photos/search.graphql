query photos_search($object_uuid: String!, $photo_type: String, $limit: Int = 30) {
  photos: records(
    per_page: $limit
    sort: [
      { properties: { name: "position", order: ASC } }
      { created_at: { order: ASC } }
    ]
    filter: {
      table: { value: "listing_photo" }
      properties: [
        { name: "object_uuid", value: $object_uuid }
        { name: "photo_type", value: $photo_type }
      ]
    }
  ) {
    results {
      id
      position: property_int(name: "position")
      photo_width: property_int(name: "photo_width")
      photo_height: property_int(name: "photo_height")
      photo_type: property(name: "photo_type")
      host_id: property(name: "host_id")
      photo: property_upload(name: "photo") { file_name url versions }
    }
  }
}