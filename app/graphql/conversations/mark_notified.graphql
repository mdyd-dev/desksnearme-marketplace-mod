mutation conversation_mark_notified($id: ID!, $host_notified_at: String, $guest_notified_at: String) {
  record_update(
    id: $id
    record: {
      properties: [
        { name: "host_notified_at", value: $host_notified_at }
        { name: "guest_notified_at", value: $guest_notified_at }
      ]
    }
  ) {
    id
  }
}