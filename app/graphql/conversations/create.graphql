mutation conversation_create($guest_id: String!, $host_id: String!, $listing_id: String!, $listing_title: String, $host_name: String, $guest_name: String, $last_message_at: String, $type: String) {
  record_create(record: {
    table: "conversation"
    properties: [
      { name: "guest_id", value: $guest_id }
      { name: "host_id", value: $host_id }
      { name: "listing_id", value: $listing_id }
      { name: "listing_title", value: $listing_title }
      { name: "host_name", value: $host_name }
      { name: "guest_name", value: $guest_name }
      { name: "last_message_at", value: $last_message_at }
      { name: "type", value: $type }
    ]
  }) { id }
}