mutation conversation_archive($id: ID!, $host_archived_at: String, $guest_archived_at: String) {
  record_update(
    id: $id
    record: {
      properties: [
        { name: "host_archived_at", value: $host_archived_at }
        { name: "guest_archived_at", value: $guest_archived_at }
      ]
    }
  ) {
    id
  }
}