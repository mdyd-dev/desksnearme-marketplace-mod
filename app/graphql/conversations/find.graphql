query conversation_find($guest_id: String!, $host_id: String!, $listing_id: String!) {
  records(per_page: 1, filter: { table: { value: "conversation" }, properties: [
    { name: "guest_id", value: $guest_id },
    { name: "host_id", value: $host_id },
    { name: "listing_id", value: $listing_id }
  ] }) {
    results { id }
  }
}