query profiles_get_by_users($user_ids: [String!]!) {
  records(
    per_page: 100
    filter: {
      table: { value: "profile" }
      properties: [{ name: "user_id", value_in: $user_ids }]
    }
  ) {
    results {
      id
      user_id: property(name: "user_id")
      role: property(name: "role")
      confirmed_at: property(name: "confirmed_at")
    }
  }
}