query profile_get_by_user($user_id: String!) {
  records(per_page: 1, filter: { table: { value: "profile" }, properties: [{ name: "user_id", value: $user_id }] }) {
    results {
      id
      role: property(name: "role")
      phone: property(name: "phone")
      bio: property(name: "bio")
      company_name: property(name: "company_name")
      confirmed_at: property(name: "confirmed_at")
      reset_sent_at: property(name: "reset_sent_at")
      created_at
    }
  }
}