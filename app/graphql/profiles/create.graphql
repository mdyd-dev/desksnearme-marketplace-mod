mutation profile_create($user_id: String!, $role: String!, $confirmation_token: String, $confirmation_sent_at: String) {
  record_create(record: {
    table: "profile"
    properties: [
      { name: "user_id", value: $user_id }
      { name: "role", value: $role }
      { name: "confirmation_token", value: $confirmation_token }
      { name: "confirmation_sent_at", value: $confirmation_sent_at }
    ]
  }) { id }
}