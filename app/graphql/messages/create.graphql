mutation message_create(
  $conversation_id: String!
  $sender_id: String!
  $sender_name: String
  $recipient_id: String!
  $body: String!
) {
  record_create(record: {
    table: "message"
    properties: [
      { name: "conversation_id", value: $conversation_id }
      { name: "sender_id", value: $sender_id }
      { name: "sender_name", value: $sender_name }
      { name: "recipient_id", value: $recipient_id }
      { name: "body", value: $body }
      { name: "read", value_boolean: false }
    ]
  }) { id }
}