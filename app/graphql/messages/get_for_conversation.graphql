query messages_for_conversation($conversation_id: String!, $per_page: Int = 200) {
  records(
    per_page: $per_page
    sort: [{ created_at: { order: ASC } }]
    filter: {
      table: { value: "message" }
      properties: [{ name: "conversation_id", value: $conversation_id }]
    }
  ) {
    total_entries
    results {
      id
      sender_id: property(name: "sender_id")
      sender_name: property(name: "sender_name")
      body: property(name: "body")
      created_at
    }
  }
}