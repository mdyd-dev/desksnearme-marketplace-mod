query favorite_ids_for_user($user_id: String!) {
  records(
    per_page: 200
    sort: [{ created_at: { order: DESC } }]
    filter: {
      table: { value: "favorite" }
      properties: [{ name: "user_id", value: $user_id }]
    }
  ) {
    total_entries
    results {
      id
      listing_id: property(name: "listing_id")
    }
  }
}