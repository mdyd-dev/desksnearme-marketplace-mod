query favorite_find($user_id: String!, $listing_id: String!) {
  records(
    per_page: 1
    filter: {
      table: { value: "favorite" }
      properties: [
        { name: "user_id", value: $user_id }
        { name: "listing_id", value: $listing_id }
      ]
    }
  ) {
    results {
      id
    }
  }
}